name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"  # Roda todo dia às 03:00
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:  # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=dark&ring=FF4073&border=FF4073&fire=FF4073&currStreakLabel=FF4073&stroke=FF4073&sideLabels=FF4073&background=11111A
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}
      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
